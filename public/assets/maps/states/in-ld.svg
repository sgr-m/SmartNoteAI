<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000">
  <defs>
    <style>
      .state-title { font-family: 'system-ui', -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: #0f172a; text-anchor: middle; letter-spacing: 1.5px; }
      .state-sub { font-family: 'system-ui', -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #dc2626; text-anchor: middle; letter-spacing: 0.5px; }
      .state-meta { font-family: 'system-ui', -apple-system, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .dist-name { font-family: 'system-ui', -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; paint-order: stroke; stroke: #ffffff; stroke-width: 2.5px; stroke-linejoin: round; }
      .cap-badge { font-family: 'system-ui', -apple-system, sans-serif; font-size: 13px; font-weight: 800; fill: #b91c1c; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; }
      .scale-text { font-family: monospace; font-size: 11px; fill: #1e293b; font-weight: 600; }
      .legend-title { font-family: 'system-ui', sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .legend-item { font-family: 'system-ui', sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- 100% Transparent Outer Canvas (No black/dark background) -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Survey of India Official Style Border Frame -->
  <rect x="25" y="25" width="1150" height="950" rx="8" fill="none" stroke="#0f172a" stroke-width="2.5" />
  <rect x="31" y="31" width="1138" height="938" rx="5" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4" />

  <!-- Cartographic Header Block -->
  <g id="header-block">
    <text x="600" y="66" class="state-title">LAKSHADWEEP</text>
    <text x="600" y="90" class="state-sub">OFFICIAL STATE MAP — SURVEY OF INDIA &amp; CENSUS STANDARD</text>
    <text x="600" y="112" class="state-meta">Capital: Kavaratti | Region: Islands India | Area: 32 km² | 1 Districts</text>
  </g>

  <!-- Districts Multi-Polygon Fills & Boundaries -->
  <g id="district-polygons">
    <path d="M 616.4,872.0 L 616.7,872.2 L 616.6,872.3 L 616.4,872.0 Z M 617.1,866.8 L 617.0,866.7 L 617.1,866.8 L 617.1,866.8 Z M 625.6,873.0 L 623.2,875.0 L 617.9,872.6 L 624.2,872.5 L 630.7,862.0 L 625.6,873.0 Z M 747.8,486.9 L 747.8,486.9 L 747.8,486.9 L 747.8,486.9 Z M 747.7,486.9 L 747.7,486.9 L 747.6,486.9 L 747.7,486.9 Z M 748.0,486.9 L 747.9,486.9 L 748.0,486.8 L 748.0,486.9 Z M 747.7,486.9 L 747.6,486.8 L 747.6,486.8 L 747.7,486.9 Z M 747.8,486.9 L 747.7,486.8 L 748.0,486.8 L 747.8,486.9 Z M 748.1,486.8 L 748.0,486.8 L 748.1,486.7 L 748.1,486.8 Z M 747.8,486.7 L 747.7,486.7 L 747.7,486.7 L 747.8,486.7 Z M 748.0,486.7 L 747.9,486.7 L 748.0,486.7 L 748.0,486.7 Z M 748.3,486.7 L 748.1,486.7 L 748.3,486.5 L 748.3,486.7 Z M 748.6,486.2 L 748.4,486.0 L 748.6,486.0 L 748.6,486.2 Z M 747.2,485.7 L 747.2,485.9 L 746.8,486.0 L 747.2,485.7 Z M 747.7,485.6 L 747.6,485.5 L 747.7,485.4 L 747.7,485.6 Z M 751.4,486.0 L 750.0,489.2 L 748.7,486.2 L 752.1,479.6 L 751.4,486.0 Z M 752.4,478.2 L 752.3,478.2 L 752.3,478.0 L 752.4,478.2 Z M 462.5,492.7 L 463.8,490.1 L 463.4,491.8 L 462.5,492.7 Z M 754.0,468.4 L 754.9,471.2 L 754.0,473.8 L 754.0,468.4 Z M 473.7,478.9 L 473.1,479.8 L 473.5,478.4 L 473.7,478.9 Z M 472.7,473.5 L 471.6,473.6 L 471.8,471.7 L 472.7,473.5 Z M 538.7,377.1 L 539.9,380.3 L 533.0,384.9 L 538.7,377.1 Z M 755.7,325.7 L 762.8,326.4 L 756.4,328.6 L 753.9,327.1 L 755.7,325.7 Z M 438.0,326.2 L 438.0,326.7 L 437.2,326.7 L 438.0,326.2 Z M 445.5,312.6 L 438.3,325.5 L 443.5,314.1 L 445.5,312.6 Z M 463.5,297.9 L 463.6,300.3 L 462.6,299.9 L 463.5,297.9 Z M 471.2,297.1 L 469.1,298.6 L 469.4,297.2 L 471.2,297.1 Z M 472.9,296.8 L 472.5,297.1 L 472.3,296.8 L 472.9,296.8 Z M 473.2,296.1 L 473.0,296.5 L 472.8,296.1 L 473.2,296.1 Z M 473.3,295.8 L 473.1,295.8 L 473.1,295.2 L 473.3,295.8 Z M 554.9,261.9 L 554.5,259.0 L 557.7,257.1 L 554.9,261.9 Z M 563.7,247.1 L 567.4,234.3 L 569.7,230.4 L 563.7,247.1 Z M 615.9,185.4 L 614.0,179.2 L 616.2,181.6 L 615.9,185.4 Z M 442.6,157.6 L 441.8,157.6 L 441.5,157.0 L 442.6,157.6 Z M 553.1,138.7 L 551.8,139.6 L 554.1,135.0 L 553.1,138.7 Z" fill="#fef3c7" stroke="#475569" stroke-width="1.2" stroke-linejoin="round" opacity="0.95">
      <title>Lakshadweep (Lakshadweep)</title>
    </path>

  </g>

  <!-- District Labels Layer -->
  <g id="district-labels">
    <g transform="translate(623.5, 438.3)">
      <text text-anchor="middle" dy=".3em" class="dist-name">Lakshadweep</text>
    </g>

  </g>

  <!-- State Capital Star Marker -->
  <g id="capital-marker" transform="translate(600.0, 505.0)">
    <circle r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <circle r="3" fill="#ffffff" />
    <text x="12" y="4" class="cap-badge">★ Kavaratti (Capital)</text>
  </g>

  <!-- North Arrow Compass Rose -->
  <g id="compass" transform="translate(1110, 85)">
    <circle r="22" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <polygon points="0,-18 5,-2 0,2 -5,-2" fill="#dc2626" />
    <polygon points="0,18 5,2 0,-2 -5,2" fill="#0f172a" />
    <text x="0" y="-22" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="800" fill="#dc2626">N</text>
  </g>

  <!-- Graphic Scale Bar -->
  <g id="scale-bar" transform="translate(60, 910)" filter="url(#cardShadow)">
    <rect x="-10" y="-18" width="157" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="0" y="-4" class="scale-text">SCALE 1 : 1,000,000</text>
    <rect x="0" y="4" width="97" height="6" fill="#0f172a" />
    <rect x="0" y="4" width="49" height="6" fill="#dc2626" />
    <text x="0" y="22" class="scale-text">0</text>
    <text x="49" y="22" class="scale-text">25</text>
    <text x="97" y="22" class="scale-text">50 km</text>
  </g>

  <!-- Legend & Symbology Card -->
  <g id="legend" transform="translate(930, 810)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="220" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="22" class="legend-title">MAP LEGEND &amp; SYMBOLS</text>
    <g transform="translate(14, 40)">
      <circle cx="6" cy="4" r="5" fill="#dc2626" />
      <text x="18" y="8" class="legend-item">State Capital (★)</text>
    </g>
    <g transform="translate(14, 62)">
      <circle cx="6" cy="4" r="3.5" fill="#475569" />
      <text x="18" y="8" class="legend-item">District Headquarters (●)</text>
    </g>
    <g transform="translate(14, 84)">
      <line x1="0" y1="4" x2="14" y2="4" stroke="#0f172a" stroke-width="2.5" />
      <text x="18" y="8" class="legend-item">State Boundary (Survey of India)</text>
    </g>
    <g transform="translate(14, 106)">
      <line x1="0" y1="4" x2="14" y2="4" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,2" />
      <text x="18" y="8" class="legend-item">Internal District Boundary</text>
    </g>
    <g transform="translate(14, 126)">
      <line x1="0" y1="4" x2="14" y2="4" stroke="#0284c7" stroke-width="2" />
      <text x="18" y="8" class="legend-item">Major Drainage River</text>
    </g>
  </g>

  <!-- Official Government Attribution Footer -->
  <text x="600" y="964" text-anchor="middle" font-family="system-ui" font-size="10" fill="#64748b">
    © Survey of India / Registrar General &amp; Census Commissioner of India. Official boundary and territorial integrity strictly preserved. Source: https://lakshadweep.gov.in
  </text>
</svg>