      <title>Puducherry (Puducherry)</title>
    </path>
    <path d="M 707.8,868.6 L 707.5,868.5 L 708.0,868.4 L 707.8,868.6 Z M 699.5,863.3 L 699.5,863.4 L 699.4,863.4 L 699.4,863.4 L 699.5,863.3 Z M 697.3,861.5 L 697.1,861.4 L 697.3,861.3 L 697.3,861.5 Z M 697.7,861.8 L 698.3,861.7 L 697.6,860.7 L 698.7,859.4 L 699.1,858.8 L 697.1,859.4 L 697.0,857.4 L 700.1,857.7 L 700.3,858.9 L 702.4,858.4 L 702.5,858.4 L 701.4,856.0 L 701.1,855.2 L 700.5,853.9 L 700.4,853.8 L 700.4,853.4 L 701.1,853.1 L 701.6,853.1 L 705.1,853.8 L 706.6,855.6 L 708.7,853.0 L 712.3,854.0 L 713.1,855.1 L 713.0,874.9 L 710.6,875.0 L 710.2,872.2 L 707.8,871.5 L 707.7,870.3 L 709.8,870.3 L 708.2,868.4 L 710.1,867.9 L 710.2,867.9 L 705.7,866.6 L 704.8,867.4 L 706.3,865.6 L 705.5,864.9 L 701.5,867.0 L 702.3,864.1 L 699.9,863.2 L 699.9,862.9 L 697.7,862.3 L 697.7,861.8 Z" fill="#fee2e2" stroke="#475569" stroke-width="1.2" stroke-linejoin="round" opacity="0.95">
